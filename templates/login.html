<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Organização Financeira</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: linear-gradient(160deg, #3b0764, #6b21a8, #7c3aed); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .box { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); padding: 32px 28px; border-radius: 24px; color: white; width: 100%; max-width: 360px; text-align: center; }
        .icone { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        h2 { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
        .subtitulo { font-size: 13px; opacity: 0.75; margin-bottom: 24px; }
        input { width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.15); color: white; font-size: 14px; }
        input::placeholder { color: rgba(255,255,255,0.6); }
        button { width: 100%; padding: 13px; background: white; color: #7c3aed; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 15px; margin-top: 4px; }
        button:hover { background: #f0e6ff; }
        .link { margin-top: 20px; font-size: 13px; opacity: 0.8; }
        .link a { color: white; font-weight: bold; }
        .erro { background: rgba(255,0,0,0.2); border: 1px solid rgba(255,100,100,0.4); padding: 10px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
    </style>
</head>
<body>
  <div class="box">
    <div class="icone">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v2m0 8v2M9 9.5A2.5 2.5 0 0 1 11.5 7H13a2 2 0 0 1 0 4h-2a2 2 0 0 0 0 4h1.5A2.5 2.5 0 0 0 15 12.5"/>
        </svg>
    </div>
    <h2>Organização Financeira</h2>
    <p class="subtitulo">Entre na sua conta</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="erro">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form action="/login" method="POST">
      <input type="email" name="email" placeholder="Seu email" required>
      <input type="password" name="senha" placeholder="Sua senha" required>
      <button type="submit">Entrar</button>
    </form>
    <p class="link">Não tem conta? <a href="/cadastro">Cadastre-se grátis</a></p>
  </div>
</body>
</html>
