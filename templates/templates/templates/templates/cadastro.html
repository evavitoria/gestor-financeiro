<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <style>
        body { font-family: sans-serif; background: #f3ecf3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #9a52d8; padding: 30px; border-radius: 15px; color: white; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #d852e7; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        a { color: #f0c0ff; }
        .erro { background: rgba(255,0,0,0.2); padding: 8px; border-radius: 5px; margin-bottom: 10px; font-size: 13px; }
    </style>
</head>
<body>
  <div class="box">
    <h2>Criar conta</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="erro">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form action="/cadastro" method="POST">
      <input type="text" name="nome" placeholder="Seu nome" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="senha" placeholder="Senha" required>
      <button type="submit">Cadastrar</button>
    </form>
    <p style="margin-top:15px; font-size:13px;">Já tem conta? <a href="/login">Entrar</a></p>
  </div>
</body>
</html>
