<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — Organização Financeira</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #0f2818; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 420px; }
        .titulo { color: white; font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 8px; }
        .subtitulo { color: rgba(255,255,255,0.6); font-size: 14px; text-align: center; margin-bottom: 28px; }
        .box { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 36px 28px; border-radius: 16px; }
        input { width: 100%; padding: 13px 16px; margin-bottom: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: white; font-size: 14px; }
        input::placeholder { color: rgba(255,255,255,0.5); }
        input:focus { outline: none; border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.12); }
        button { width: 100%; padding: 13px; background: white; color: #0f2818; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 15px; margin-top: 4px; }
        button:hover { background: #e8ede9; }
        .links { margin-top: 20px; text-align: center; font-size: 13px; color: rgba(255,255,255,0.6); }
        .links a { color: white; text-decoration: none; font-weight: 500; }
        .links a:hover { text-decoration: underline; }
        .erro { background: rgba(220,50,50,0.15); border: 1px solid rgba(220,50,50,0.4); padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; color: #fca5a5; }
        .voltar { display: block; text-align: center; margin-bottom: 24px; color: rgba(255,255,255,0.5); font-size: 13px; text-decoration: none; }
        .voltar:hover { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="voltar">← Voltar</a>
        <p class="titulo">Criar conta grátis</p>
        <p class="subtitulo">Comece a organizar suas finanças hoje</p>
        <div class="box">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}
                        <div class="erro">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form action="/cadastro" method="POST">
                <input type="text" name="nome" placeholder="Seu nome" required>
                <input type="email" name="email" placeholder="Seu email" required>
                <input type="password" name="senha" placeholder="Sua senha" required>
                <button type="submit">Criar conta grátis</button>
            </form>
            <div class="links">
                Já tem conta? <a href="{{ url_for('login') }}">Entrar</a>
            </div>
        </div>
    </div>
</body>
</html>
